<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Profesor Kedelai Menjelajahi Dunia Bioteknologi</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#6f9a2f;--gd:#3f6a1c;--y:#f4c542;--cream:#fbf3dc;--card:#fffaf0;--br:#5b3a1e;--ink:#3b2a1a;--line:#e3d3a8;--bad:#c0452f;--ok:#3f8f2f;--bg:var(--cream);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#2a2415;--card:#362e1b;--ink:#f6ebcf;--line:#5b4c2a;--bg:var(--cream);--gd:#a8d36a}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:16px;line-height:1.55;min-height:100vh}
h1,h2,h3{font-family:'Baloo 2','Nunito',system-ui,sans-serif;line-height:1.15;margin:.2em 0 .4em;color:var(--gd)}
h1{font-size:clamp(1.9rem,8vw,3rem);font-weight:800}h2{font-size:1.6rem}h3{font-size:1.15rem}
#app{max-width:720px;margin:0 auto;padding:12px 16px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar{flex:1;height:12px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--y));transition:width .4s}
.pill{font-family:'Baloo 2';font-weight:700;background:var(--br);color:#fff;border-radius:20px;padding:2px 12px;font-size:.9rem}
.btn{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1.1rem;border:0;border-radius:16px;padding:12px 22px;background:var(--g);color:#fff;box-shadow:0 5px 0 var(--gd);cursor:pointer;margin:6px 6px 10px 0;min-height:48px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gd)}.btn.y{background:var(--y);color:var(--br);box-shadow:0 5px 0 #b98d12}.btn.o{background:transparent;color:var(--br);border:2px solid var(--br);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn:focus-visible,.opt:focus-visible,.tile:focus-visible{outline:3px solid var(--br);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;margin:12px 0}
.hero{text-align:center;padding-top:10px}.hero .prof{width:min(260px,68vw);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bubble{position:relative;background:#fff;color:#3b2a1a;border:3px solid var(--br);border-radius:20px;padding:12px 16px;margin:6px 0 14px;text-align:left}
.profrow{display:flex;gap:10px;align-items:flex-end}.profrow svg{width:84px;flex:none}.profrow .bubble{flex:1}
.mission{display:flex;gap:12px;align-items:flex-start}.mission b{font-size:1.8rem}
.scene{background:linear-gradient(#e9f3cf,#cfe3a0);border:3px solid var(--br);border-radius:22px;text-align:center;font-size:3.4rem;padding:22px 8px;min-height:130px;letter-spacing:4px;position:relative;overflow:hidden}
.steps{display:flex;gap:6px;margin:8px 0}.steps span{flex:1;height:8px;border-radius:6px;background:var(--line)}.steps .on{background:var(--g)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile,.opt{font:inherit;font-weight:700;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:16px;padding:12px;text-align:left;cursor:pointer;width:100%;margin:5px 0}
.tile{text-align:center;min-height:64px;margin:0}.tile.sel{border-color:var(--y);background:#fff3bd;color:#3b2a1a}.tile.done{border-color:var(--ok);background:#dff0c8;color:#254a12;opacity:.8}.tile.bad{border-color:var(--bad);animation:sh .3s}
.opt.right{border-color:var(--ok);background:#dff0c8;color:#254a12}.opt.wrong{border-color:var(--bad);background:#f8d9d1;color:#6b1f12}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{border-radius:14px;padding:10px 14px;margin:8px 0;font-weight:700}.fb.ok{background:#dff0c8;color:#254a12}.fb.no{background:#f8d9d1;color:#6b1f12}.fb.info{background:#fff3bd;color:#5b3a1e}
.doors{display:flex;gap:8px;justify-content:center;font-size:2rem;margin:8px 0}.doors span{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:4px 12px}.doors .open{border-color:var(--ok);background:#dff0c8}.doors .cur{border-color:var(--y);animation:bob 2s infinite}
input[type=range]{width:100%;accent-color:var(--g);height:34px}
ul.sum{padding-left:20px}ul.sum li{margin:6px 0}.big{font-family:'Baloo 2';font-size:3rem;font-weight:800;color:var(--gd);text-align:center}
.muted{opacity:.8;font-size:.95rem}.mold{position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,#fff 0,transparent 35%),radial-gradient(circle at 70% 60%,#fff 0,transparent 40%),radial-gradient(circle at 50% 20%,#fff 0,transparent 30%);pointer-events:none}
.scene{font-size:1rem;letter-spacing:0;padding:10px 8px}.scene svg{width:100%;max-width:360px;height:auto;display:block;margin:0 auto}.cap{display:block;font-weight:700;color:#3b2a1a;margin-top:4px}
.rise{animation:rise 2s infinite}.fall{animation:fall 2s infinite}.tw{animation:tw 1.2s infinite;transform-box:fill-box;transform-origin:center}.sway{animation:sway 1.6s infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-34px);opacity:0}}@keyframes fall{from{transform:translateY(-45px);opacity:0}30%{opacity:1}to{transform:translateY(0);opacity:0}}@keyframes tw{50%{opacity:.2;transform:scale(.5)}}@keyframes sway{50%{transform:scaleY(1.25) skewX(6deg)}}
.info h3{margin:0}.info p{margin:2px 0 10px}
.cf{position:fixed;top:-30px;z-index:50;pointer-events:none;animation:cf 2s ease-in forwards}@keyframes cf{to{transform:translateY(110vh) rotate(540deg);opacity:.7}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--br);color:#fff;font-family:'Baloo 2';font-weight:700;padding:10px 18px;border-radius:24px;z-index:60;animation:pop .3s;max-width:90vw;text-align:center}@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.hero{position:relative}.fl{pointer-events:none}.fl span{position:absolute;font-size:2rem;opacity:.55;animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-14px) rotate(12deg)}}
.badge{display:inline-block;background:#fff3bd;color:#5b3a1e;border:2px solid var(--y);border-radius:20px;padding:4px 12px;margin:3px;font-weight:700}
.pop{animation:pp .4s}@keyframes pp{from{transform:scale(.5) rotate(-6deg);opacity:0}}.shake{animation:sh .4s}
.sea{position:relative;height:330px;background:linear-gradient(#cfe9f5,#9ccfe8);border:3px solid var(--br);border-radius:20px;overflow:hidden}.mb{position:absolute;width:42%;background:#e8f5c8;color:#254a12;border:3px solid var(--g);border-radius:40px;padding:8px;font-size:.72rem;font-weight:700;animation:drift 3s ease-in-out infinite alternate;cursor:pointer}@keyframes drift{to{transform:translate(14px,24px)}}
.trk{position:relative;background:#fff;border:3px solid var(--br);border-radius:16px;padding:6px 44px 6px 6px;color:#3b2a1a}.lane{position:relative;height:46px;border-bottom:2px dashed var(--line)}.lane span{position:absolute;font-size:2rem;transition:left .6s}.fin{position:absolute;right:8px;top:30%;font-size:2rem}
.rev{position:relative;width:200px;height:200px;margin:10px auto;background:#fff3bd;border:3px solid var(--br);border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}.em{font-size:6rem}.cv{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr)}.cv i{background:var(--g);border:2px solid var(--gd);transition:opacity .5s}
@media print{body *{visibility:hidden}#cert,#cert *{visibility:visible}#cert{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const PROF=(w=260)=>`<svg class="prof" viewBox="0 0 200 250" role="img" aria-label="Profesor Kedelai"><ellipse cx="100" cy="240" rx="58" ry="8" fill="#0002"/><path d="M52 150 Q100 135 148 150 L158 232 L42 232Z" fill="#fff" stroke="#5b3a1e" stroke-width="5" stroke-linejoin="round"/><path d="M100 148 L100 232" stroke="#5b3a1e" stroke-width="4"/><rect x="118" y="175" width="22" height="26" rx="3" fill="#e8f2d0" stroke="#5b3a1e" stroke-width="3"/><circle cx="128" cy="165" r="5" fill="#f4c542" stroke="#5b3a1e" stroke-width="2"/><path d="M84 148 L100 175 L116 148" fill="#a8cf5a" stroke="#5b3a1e" stroke-width="4"/><ellipse cx="100" cy="85" rx="62" ry="68" fill="#e9c77b" stroke="#5b3a1e" stroke-width="5" transform="rotate(-8 100 85)"/><path d="M62 52 Q70 38 88 34" stroke="#fff8" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="76" cy="80" r="19" fill="#fff" stroke="#5b3a1e" stroke-width="5"/><circle cx="124" cy="80" r="19" fill="#fff" stroke="#5b3a1e" stroke-width="5"/><path d="M95 80 H105" stroke="#5b3a1e" stroke-width="5"/><circle cx="79" cy="82" r="7" fill="#3b2a1a"/><circle cx="121" cy="82" r="7" fill="#3b2a1a"/><circle cx="81" cy="79" r="2.5" fill="#fff"/><circle cx="123" cy="79" r="2.5" fill="#fff"/><path d="M80 118 Q100 136 120 118" stroke="#5b3a1e" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="58" cy="108" r="8" fill="#f2a48a" opacity=".6"/><circle cx="142" cy="108" r="8" fill="#f2a48a" opacity=".6"/><path d="M98 22 Q92 6 108 4 M104 22 Q118 8 112 -2" stroke="#6f9a2f" stroke-width="6" fill="none" stroke-linecap="round"/></svg>`;
const say=t=>`<div class="profrow">${PROF().replace('class="prof"','')}<div class="bubble">${t}</div></div>`;
let page='home',S={},G={xp:0,st:0,b:[],sn:false};
function award(n,b){G.xp+=n;let m=n?`+${n} XP ⭐`:'';if(b&&!G.b.includes(b)){G.b.push(b);m+=(m?' · ':'')+'Lencana baru: '+b}if(m)toast(m)}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
function boom(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const e=['🫘','⭐','🎉','🧪','✨'];for(let i=0;i<22;i++){const c=document.createElement('span');c.className='cf';c.textContent=e[i%5];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*.4+'s';c.style.fontSize=(16+Math.random()*16)+'px';document.body.appendChild(c);setTimeout(()=>c.remove(),2400)}}
const order=['home','guide','m1','m2','m3','m4','arena','end'];
function go(p){clearInterval(G.iv);page=p;S={};window.scrollTo(0,0);render()}
function topbar(){const i=order.indexOf(page);return `<div class="top"><button class="btn o" style="margin:0;padding:6px 14px;min-height:40px" onclick="go('home')" aria-label="Ke beranda">🏠</button><div class="bar"><i style="width:${i/(order.length-1)*100}%"></i></div><button class="btn o" style="margin:0;padding:4px 10px;min-height:40px" onclick="toggleSnd()" aria-label="Suara dan musik">${G.sn?'🔊':'🔇'}</button><span class="pill">⭐ ${G.xp} XP · ${i}/7</span></div>`}
function render(){const f={home,guide,m1,m2,m3,m4,arena,gBox,gCatch,gRace,gBoss,gTebak,end}[page];$('#app').innerHTML=(page=='home'?'':topbar())+f()}

function home(){return `<div class="hero"><div class="fl" aria-hidden="true"><span style="left:2%;top:6%">🧪</span><span style="right:3%;top:10%;animation-delay:.8s">🦠</span><span style="left:4%;top:48%;animation-delay:1.6s">🫘</span><span style="right:4%;top:52%;animation-delay:2.4s">🧫</span><span style="left:12%;top:78%;animation-delay:1s">⚗️</span><span style="right:10%;top:80%;animation-delay:2s">🔬</span></div>${PROF()}<h1>Petualangan Profesor Kedelai</h1><h3>Menjelajahi Dunia Bioteknologi 🔬</h3><div class="bubble">Halo, Petualang Muda! Aku Profesor Kedelai. Laboratoriumku penuh keajaiban mikroorganisme. Yuk bantu aku menyelesaikan empat misi!</div><button class="btn y" style="font-size:1.3rem" onclick="go('guide')">🚀 MULAI PETUALANGAN</button><br><button class="btn o" onclick="go('arena')">🎮 Arena Game</button></div>`}
function guide(){return `<h2>Petunjuk Petualangan</h2>${say('Baca dulu peta misinya ya, supaya petualanganmu lancar!')}
<div class="card"><h3>Cara menggunakan</h3><ul class="sum"><li>Ketuk tombol atau pilihan jawaban untuk berinteraksi.</li><li>Selesaikan misi berurutan dari 1 sampai 4.</li><li>Jawaban benar memberi poin; jawaban salah tetap ada penjelasannya.</li><li>Tombol 🏠 membawamu kembali ke beranda.</li></ul></div>
<div class="card"><div class="mission"><b>🧪</b><div><h3>Misi 1: Laboratorium Virtual</h3>Praktikkan 5 tahap pembuatan tempe.</div></div></div>
<div class="card"><div class="mission"><b>🧩</b><div><h3>Misi 2: Game Mencocokkan</h3>Pasangkan produk dengan mikroorganismenya.</div></div></div>
<div class="card"><div class="mission"><b>🔐</b><div><h3>Misi 3: Escape Room</h3>Pecahkan 4 teka-teki untuk membuka pintu.</div></div></div>
<div class="card"><div class="mission"><b>🏆</b><div><h3>Misi 4: Kuis Evaluasi</h3>Jawab 17 soal Fase E (C1–C6) dan lihat skormu.</div></div></div>
<button class="btn o" onclick="go('home')">← Kembali</button><button class="btn y" onclick="go('m1')">Mulai Misi 1 →</button>`}

/* MISI 1 */
const T=[
{n:'Persiapan Kedelai',acts:['Pilih &amp; cuci kedelai'],sc:['🫘🫘🫘<br><small>Kedelai masih bercampur kotoran</small>','🫘✨🫘<br><small>Kedelai bersih &amp; terpilih</small>'],tx:'Pilih biji kedelai yang utuh dan bagus, lalu cuci bersih untuk membuang kotoran dan mikroba pengganggu.'},
{n:'Perendaman &amp; Perebusan',acts:['Rendam 12 jam','Rebus 30 menit','Kupas kulit &amp; tiriskan'],sc:['🫘<br><small>Kedelai kering</small>','🫘💧🥣<br><small>Merendam: kedelai melunak &amp; mengembang</small>','🍲🔥<br><small>Merebus: mematikan mikroba lain</small>','🫘🧺<br><small>Kulit terkelupas, kedelai ditiriskan &amp; dingin</small>'],tx:'Perendaman melunakkan biji dan menurunkan pH (asam) alami. Perebusan mematikan mikroba pengganggu. Kulit dikupas agar kapang mudah tumbuh.'},
{n:'Penambahan Ragi',acts:['Taburkan ragi tempe'],sc:['🫘🫘🫘<br><small>Kedelai siap diberi ragi</small>','🫘✨🫘<br><small>Ragi Rhizopus oligosporus tercampur rata</small>'],tx:'Ragi tempe berisi spora kapang Rhizopus oligosporus. Aduk rata, lalu bungkus dengan daun pisang atau plastik berlubang agar ada udara.'},
{n:'Fermentasi',acts:[],sc:[],tx:'Geser pengatur waktu hingga 48 jam. Kapang tumbuh, miselium putih mengikat biji menjadi satu. Suhu ideal 30–37°C.'},
{n:'Hasil Akhir: Tempe!',acts:[],sc:['🟫🤍🟫<br><small>Tempe padat berselimut miselium putih</small>'],tx:'Selamat! Fermentasi menghasilkan tempe dengan protein lebih mudah dicerna, mengandung vitamin B12 dan bebas kolesterol. Contoh bioteknologi konvensional.'}];
const BN=[[-34,0],[-12,4],[12,0],[34,5],[-24,-14],[0,-12],[24,-14]];
const bean=(x,y,c,r)=>`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.7}" fill="${c}" stroke="#5b3a1e" stroke-width="1.5" transform="rotate(${(x*7)%40-20} ${x} ${y})"/>`;
const bs=(cx,cy,c,r)=>BN.map(p=>bean(cx+p[0],cy+p[1],c,r)).join('');
function ill(s,a,h){const tb='<rect x="0" y="140" width="300" height="30" fill="#b98a55"/>';
 const bowl='<path d="M85 95 Q150 175 215 95Z" fill="#c98a4b" stroke="#5b3a1e" stroke-width="3"/>';
 const tray='<rect x="70" y="100" width="160" height="40" rx="8" fill="#6f9a2f" stroke="#3f6a1c" stroke-width="3"/>';
 let g='';
 if(s==0){g=bowl+bs(150,95,a?'#e9c77b':'#c9a55e',10);g+=a?[[100,60],[200,55],[150,40]].map((p,i)=>`<text class="tw" x="${p[0]}" y="${p[1]}" font-size="22" style="animation-delay:${i*.3}s">✨</text>`).join('')+[[120,40],[180,35]].map((p,i)=>`<circle class="fall" cx="${p[0]}" cy="${p[1]+40}" r="4" fill="#7cc4e8" style="animation-delay:${i*.5}s"/>`).join(''):[[110,70],[150,62],[190,72]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#8a8a8a"/>`).join('')}
 else if(s==1){if(a<2){g=bowl+(a?'<ellipse cx="150" cy="98" rx="60" ry="11" fill="#7cc4e8" opacity=".75"/>':'')+bs(150,a?90:95,a?'#f0d48e':'#d9b26a',a?12:9);g+=a?[120,150,180].map((x,i)=>`<circle class="rise" cx="${x}" cy="88" r="4" fill="#fff" style="animation-delay:${i*.6}s"/>`).join(''):''}
 else if(a==2){g='<rect x="95" y="70" width="110" height="70" rx="10" fill="#8a8a8a" stroke="#3b2a1a" stroke-width="3"/><rect x="85" y="72" width="130" height="10" rx="5" fill="#a8a8a8" stroke="#3b2a1a" stroke-width="3"/><path class="sway" d="M130 140 Q120 120 135 110 Q138 125 150 118 Q165 128 160 140Z" fill="#f08a2a"/>'+[120,150,180].map((x,i)=>`<path class="rise" d="M${x} 60 q-8 -10 0 -20" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" style="animation-delay:${i*.6}s"/>`).join('')}
 else{g=tray+bs(150,112,'#f3dfa0',9)+[[40,110],[260,120],[250,100]].map(p=>`<path d="M${p[0]} ${p[1]} q8 -8 14 2 q-8 2 -14 -2" fill="#a9743a"/>`).join('')}}
 else if(s==2){g=tray+bs(150,112,'#f3dfa0',9)+[90,120,150,180,210].map((x,i)=>`<circle class="${a?'fall':''}" cx="${x}" cy="${60+(i%2)*14}" r="4" fill="#fff" stroke="#3b2a1a" stroke-width="1.5" style="animation-delay:${i*.3}s" ${a?'':'opacity="0"'}/>`).join('')+(a?'':'<text x="150" y="60" text-anchor="middle" font-size="13" fill="#3b2a1a">spora belum ditabur</text>')}
 else if(s==3){const o=h/48;g='<rect x="60" y="60" width="170" height="80" rx="14" fill="#4f8a2a" stroke="#3f6a1c" stroke-width="3"/>'+bs(145,100,'#f3dfa0',11)+[[100,90],[145,85],[190,95],[120,115],[170,115],[145,105]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="${6+o*14}" fill="#fff" opacity="${o*.9}"/>`).join('')+`<rect x="250" y="40" width="14" height="90" rx="7" fill="#fff" stroke="#3b2a1a" stroke-width="2"/><rect x="253" y="${130-(30+o*30)}" width="8" height="${30+o*30}" rx="4" fill="#d0452f"/><text x="257" y="34" text-anchor="middle" font-size="12" fill="#3b2a1a">30–37°C</text>`}
 else{g='<rect x="50" y="80" width="120" height="55" rx="12" fill="#fff6dc" stroke="#5b3a1e" stroke-width="3"/>'+[[75,100],[100,115],[125,100],[150,115],[85,122],[135,125]].map(p=>bean(p[0],p[1],'#e9c77b',6)).join('')+[0,1,2].map(i=>`<rect x="${185+i*28}" y="${95+i*4}" width="22" height="42" rx="6" fill="#e0a840" stroke="#5b3a1e" stroke-width="2"/>`).join('')+'<text class="tw" x="110" y="60" font-size="26">✨</text><text class="tw" x="210" y="70" font-size="22" style="animation-delay:.4s">✨</text>'}
 return `<svg viewBox="0 0 300 170" role="img" aria-label="Ilustrasi tahap ${s+1}">${tb}${g}</svg>`}
const FACTS=['Kedelai mengandung protein sekitar 35–40%. Biji dicuci dan dipilih supaya bakteri pembusuk tidak ikut tumbuh, sehingga hanya kapang tempe yang berkembang.','Saat direndam, bakteri asam laktat alami menurunkan pH sehingga bakteri pembusuk terhambat. Perebusan melunakkan biji dan mematikan mikroba lain. Kulit dikupas agar miselium dapat menembus biji.','Spora Rhizopus oligosporus berukuran mikroskopis dan butuh oksigen, itu sebabnya bungkus tempe dilubangi. Ragi ditabur saat kedelai sudah dingin agar spora tidak mati oleh panas.','Kapang mengeluarkan enzim protease, lipase, dan amilase yang memecah protein, lemak, dan karbohidrat menjadi molekul sederhana. Fermentasi menghasilkan panas sendiri, jadi tempe perlu sirkulasi udara.','Fermentasi membuat protein lebih mudah dicerna dan menambah vitamin B12. Bintik hitam berarti spora matang (masih aman), tetapi tempe berlendir dan berbau busuk sudah rusak.'];

 <button class="btn o" ${s==0?'disabled':''} onclick="S={s:${s-1},a:99,h:48};render()">←</button><button class="btn" ${ok?'':'disabled'} onclick="${s<4?`S={s:${s+1},a:0,h:0};render()`:`award(25,'🧑‍🍳 Chef Tempe');go('m2')`}">${s<4?'Tahap berikutnya →':'Lanjut ke Misi 2 →'}</button>`}

{t:'Pintu 2: Konvensional dan Modern',q:'Kode pintu: pilih pasangan yang BENAR!',o:['Tempe = bioteknologi modern','Yoghurt = rekayasa genetika','Kultur jaringan = bioteknologi konvensional','Tape = rekayasa genetika','Insulin hasil rekayasa genetika = bioteknologi modern'],a:4,e:'Konvensional memakai mikroorganisme apa adanya (tempe, yoghurt). Modern memakai rekayasa genetika atau kultur jaringan.'},

const Q=[
{l:'C1',q:'Molekul DNA melingkar kecil di luar kromosom bakteri yang sering dipakai sebagai vektor untuk menyisipkan gen asing dalam rekayasa genetika disebut…',o:['Nukleoid','Ribosom','Plasmid','Flagela','Kloroplas'],a:2,e:'Plasmid adalah DNA sirkuler kecil pada bakteri yang dapat bereplikasi sendiri, sehingga dipakai sebagai vektor pembawa gen target.'},
{l:'C1',q:'Enzim yang berfungsi memotong DNA pada urutan basa nukleotida tertentu dalam teknik DNA rekombinan adalah…',o:['DNA ligase','DNA polimerase','Helikase','RNA polimerase','Enzim restriksi (endonuklease)'],a:4,e:'Enzim restriksi memotong DNA pada situs spesifik. DNA ligase justru menyambungkan potongan DNA, DNA polimerase mensintesis DNA, dan helikase membuka untai ganda.'},
{l:'C1',q:'Kemampuan sel tumbuhan yang memungkinkan satu sel atau jaringan tumbuh menjadi tanaman utuh pada kultur jaringan disebut…',o:['Totipotensi','Diferensiasi','Plasmolisis','Osmosis','Aklimatisasi'],a:0,e:'Totipotensi adalah kemampuan sel (yang masih memiliki gen lengkap) untuk berkembang menjadi individu utuh, dan menjadi dasar kultur jaringan.'},
{l:'C2',q:'Ragi memfermentasi glukosa tanpa O₂ sehingga ATP yang dihasilkan jauh lebih sedikit dibanding respirasi aerob. Penjelasan yang paling tepat adalah…',o:['Glukosa tidak diubah menjadi piruvat pada fermentasi','Fermentasi berlangsung di mitokondria yang volumenya kecil','Fermentasi menghasilkan O₂ yang kemudian menghambat pembentukan ATP','Fermentasi hanya sampai glikolisis (±2 ATP); piruvat diubah menjadi etanol dan CO₂ untuk meregenerasi NAD⁺, tanpa rantai transpor elektron','Fermentasi menghasilkan lebih banyak ATP, tetapi seluruhnya dilepaskan sebagai panas sehingga tidak terukur'],a:3,e:'Tanpa O₂, rantai transpor elektron tidak berjalan. Sel hanya mengandalkan glikolisis (2 ATP) dan mengubah piruvat menjadi etanol + CO₂ agar NAD⁺ tersedia kembali. Gas CO₂ inilah yang mengembangkan adonan roti.'},
{l:'C2',q:'Pernyataan yang paling tepat menjelaskan perbedaan bioteknologi konvensional dan modern adalah…',o:['Konvensional memakai mesin canggih, sedangkan modern memakai mikroorganisme','Konvensional memanfaatkan mikroorganisme atau proses alami tanpa mengubah materi genetik, sedangkan modern memanipulasi materi genetik (DNA) secara terarah','Konvensional hanya menghasilkan makanan, sedangkan modern hanya menghasilkan obat','Konvensional memakai organisme eukariot, sedangkan modern hanya memakai prokariot','Konvensional hanya dilakukan di rumah tangga, sedangkan modern hanya dilakukan di industri besar'],a:1,e:'Perbedaan utamanya ada pada manipulasi materi genetik: tempe, tape, dan yoghurt (konvensional) memakai mikroba apa adanya, sedangkan rekayasa genetika, kultur jaringan, dan kloning (modern) bekerja pada tingkat sel/DNA.'},
{l:'C3',q:'Urutan tahap pembuatan bakteri penghasil protein asing dengan teknik DNA rekombinan yang benar adalah…',o:['Transformasi → isolasi gen → ligasi → pemotongan gen → seleksi','Isolasi gen → ligasi → pemotongan dengan enzim restriksi → seleksi → transformasi','Pemotongan dengan DNA ligase → isolasi gen → transformasi → penyambungan dengan enzim restriksi → seleksi','Isolasi gen → transformasi → pemotongan dengan enzim restriksi → ligasi → seleksi','Isolasi gen → pemotongan gen dan plasmid dengan enzim restriksi → penyambungan dengan DNA ligase → transformasi ke bakteri → seleksi dan kloning'],a:4,e:'Gen target diisolasi, gen dan plasmid dipotong dengan enzim restriksi yang sama, disambung dengan DNA ligase, dimasukkan ke bakteri (transformasi), lalu bakteri yang berhasil diseleksi dan dikloning.'},
{l:'C3',q:'Dalam kultur jaringan kedelai, kalus akan diarahkan untuk membentuk tunas. Zat pengatur tumbuh yang harus diberikan dalam kadar relatif lebih tinggi adalah…',o:['Auksin dibanding sitokinin','Etilen saja','Sitokinin dibanding auksin','Asam absisat saja','Giberelin saja'],a:2,e:'Perbandingan hormon mengarahkan organogenesis: sitokinin tinggi memacu tunas, auksin tinggi memacu akar, dan kadar seimbang memacu pembentukan kalus.'},
{l:'C4',q:'Pak Andi membungkus kedelai yang sudah diberi ragi tempe dengan plastik TANPA dilubangi, lalu menyimpannya di wadah tertutup rapat. Setelah 48 jam, kedelai berbau amonia, lengket, dan miselium putih tidak menyatu. Analisis yang paling tepat tentang penyebabnya adalah…',o:['Rhizopus oligosporus bersifat aerob; kekurangan O₂ menghambat pertumbuhan miselium, sehingga bakteri pembusuk tumbuh dan menguraikan protein menjadi amonia','Rhizopus oligosporus bersifat anaerob, sehingga kelebihan oksigen justru membunuhnya','Suhu ruangan terlalu hangat sehingga enzim kapang berubah menjadi protein baru yang beracun','Kedelai kekurangan karbohidrat sehingga kapang berhenti membentuk spora dan langsung mati','Ragi tempe yang dipakai sudah kedaluwarsa sehingga kapang tidak hidup sama sekali'],a:0,e:'Rhizopus oligosporus adalah kapang aerob yang membutuhkan O₂ untuk membentuk miselium. Tanpa lubang udara, kapang kalah bersaing dan bakteri pembusuk menguraikan protein menjadi amonia. Solusinya: lubangi plastik atau pakai daun dan jaga sirkulasi udara.'},
{l:'C4',q:'Data perbandingan kedelai rebus dan tempe:<br>• Protein terlarut: 2,5 g → 7,0 g<br>• Asam fitat: 1,5% → 0,5%<br>• Daya cerna protein: 70% → 85%<br>Kesimpulan yang paling tepat berdasarkan data tersebut adalah…',o:['Rhizopus menambah total protein kedelai dengan mengikat nitrogen dari udara','Peningkatan daya cerna terjadi karena panas perebusan, bukan karena aktivitas kapang','Penurunan asam fitat membuktikan bahwa kapang tidak menghasilkan enzim','Enzim protease dan fitase dari Rhizopus menguraikan protein dan asam fitat sehingga protein lebih terlarut dan mudah dicerna','Penurunan asam fitat terjadi karena kapang menyerap seluruh protein kedelai'],a:3,e:'Selama fermentasi, Rhizopus mengeluarkan enzim protease (memecah protein menjadi asam amino/peptida terlarut) dan fitase (menguraikan asam fitat), sehingga nilai gizi lebih mudah diserap tubuh.'},
{l:'C4',q:'Tiga kelompok membuat tempe dengan perlakuan sama, hanya suhu inkubasi berbeda. Hasil 48 jam: 30°C → miselium putih tebal dan padat; 5°C (kulkas) → kedelai tetap utuh tanpa miselium; 60°C → tidak ada miselium. Analisis yang paling tepat adalah…',o:['Suhu hanya memengaruhi warna miselium, bukan pertumbuhannya','Suhu rendah menghambat aktivitas enzim dan metabolisme kapang, sedangkan suhu terlalu tinggi merusak enzim dan mematikan kapang','Rhizopus hanya tumbuh pada suhu rendah sehingga kulkas adalah tempat terbaik','Semua enzim bekerja paling cepat pada 60°C sehingga kapang kehabisan makanan','Pada 5°C kapang mati permanen, sedangkan pada 60°C hanya tidak aktif sementara'],a:1,e:'Rhizopus adalah mikroorganisme mesofil dengan suhu optimum sekitar 30°C. Suhu rendah memperlambat reaksi enzim, sedangkan suhu tinggi mendenaturasi enzim sehingga pertumbuhan terhenti.'},
{l:'C5',q:'Sebuah perusahaan benih mengembangkan kedelai transgenik tahan hama. Pernyataan yang paling tepat dalam mengevaluasi penggunaannya adalah…',o:['Pasti aman karena gen yang disisipkan berasal dari makhluk hidup lain','Harus ditolak total karena setiap perubahan gen pasti berbahaya bagi manusia','Tidak perlu diuji karena kedelai transgenik sama persis dengan kedelai biasa','Layak dipakai tanpa uji lanjutan karena tahan hama otomatis membuat pangan lebih sehat','Layak dipakai bila manfaatnya terbukti (hasil naik, pestisida berkurang) serta lolos uji keamanan pangan dan kajian dampak ekosistem'],a:4,e:'Evaluasi yang objektif menimbang manfaat dan risiko: produk transgenik perlu uji keamanan pangan (alergi, toksisitas) dan kajian lingkungan (misalnya perpindahan gen ke kerabat liar).'},
{l:'C5',q:'Dua metode produksi insulin dibandingkan. Metode 1: ekstraksi dari pankreas sapi. Metode 2: bakteri Escherichia coli yang disisipi gen insulin manusia. Penilaian yang paling tepat adalah…',o:['Metode 1 lebih baik karena bahan bakunya hewan sehingga sama dengan manusia','Metode 2 lebih buruk karena bakteri tidak dapat membaca gen manusia','Metode 2 lebih unggul karena insulinnya identik dengan insulin manusia, dapat diproduksi massal, dan risiko alerginya lebih rendah','Kedua metode sama saja karena sama-sama menghasilkan hormon protein','Metode 1 lebih baik karena tidak memerlukan teknologi dan bebas risiko apa pun'],a:2,e:'Kode genetik bersifat universal sehingga bakteri dapat mengekspresikan gen insulin manusia. Insulin rekombinan identik dengan insulin manusia, bisa diproduksi dalam jumlah besar, dan lebih kecil memicu reaksi alergi dibanding insulin hewan.'},
{l:'C5',q:'Seorang siswa menulis: "Tempe adalah produk rekayasa genetika karena dibuat dengan bantuan mikroorganisme." Evaluasi pernyataan tersebut.',o:['Salah, tempe termasuk bioteknologi konvensional karena memakai kapang apa adanya tanpa mengubah materi genetiknya','Benar, setiap penggunaan mikroorganisme termasuk rekayasa genetika','Benar, karena kapang tempe lebih dulu dikloning sebelum dipakai','Salah, karena tempe bukan produk bioteknologi sama sekali','Benar, karena fermentasi mengubah DNA kedelai menjadi DNA kapang'],a:0,e:'Rekayasa genetika berarti memodifikasi DNA. Tempe memanfaatkan Rhizopus alami melalui fermentasi, sehingga termasuk bioteknologi konvensional, bukan rekayasa genetika.'},
{l:'C6',q:'Kamu ingin menguji pengaruh jumlah ragi tempe terhadap ketebalan miselium. Rancangan percobaan yang paling tepat adalah…',o:['Memakai satu bungkus berisi ragi paling banyak lalu membandingkannya dengan tempe di pasar','Memberi 0, 1, 2, dan 3 g ragi, tetapi tiap bungkus memakai suhu dan lama inkubasi yang berbeda','Memberi 3 g ragi pada tiga suhu berbeda lalu menilai tempe dari baunya saja','Memberi 0, 1, 2, dan 3 g ragi pada kedelai dengan jumlah sama, suhu dan waktu inkubasi sama, tiap perlakuan diulang 3 kali, lalu mengukur tebal miselium','Memberi 1, 2, dan 3 g ragi tanpa kontrol dan tanpa pengulangan, lalu menilai miselium dari perkiraan saja'],a:3,e:'Percobaan yang baik hanya mengubah satu variabel bebas (jumlah ragi), mengendalikan variabel lain (jumlah kedelai, suhu, waktu), memakai kontrol (0 g), dan pengulangan serta pengukuran yang terukur.'},
{l:'C6',q:'Pabrik tahu di desamu membuang whey (air sisa penggumpalan) yang masih mengandung gula dan protein. Kamu merancang pemanfaatannya menjadi nata de soya. Rancangan yang paling tepat adalah…',o:['Whey langsung ditambah ragi roti, ditutup rapat tanpa udara, lalu dikocok setiap jam','Whey disaring, ditambah gula dan sumber nitrogen, diasamkan, dipasteurisasi, diinokulasi Komagataeibacter xylinus, lalu difermentasi statis (tidak digoyang) dalam wadah berpenutup kain selama 7–14 hari','Whey dipanaskan hingga mendidih, didinginkan, lalu langsung dikonsumsi tanpa inokulasi mikroorganisme','Whey ditambah Rhizopus oligosporus lalu disimpan di kulkas selama 2 hari','Whey ditambah Lactobacillus lalu dipanaskan terus pada 60°C selama 7 hari dalam wadah tertutup rapat'],a:1,e:'Nata dibentuk oleh bakteri Komagataeibacter xylinus (aerob) yang membutuhkan gula, nitrogen, pH asam, dan udara, serta tidak boleh digoyang agar selulosa terbentuk sebagai lapisan padat di permukaan.'},

n,mu:G.mu,name:G.name};go("home")'>🔁 Ulangi Petualangan</button></div>`}
